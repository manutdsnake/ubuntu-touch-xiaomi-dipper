# The qcacld driver creates two station interfaces, wlan0 and wlan1, plus p2p
# devices.  NetworkManager managed both, so every access point appeared twice
# in the WiFi list.  Only wlan0 is meant for the user.
[keyfile]
unmanaged-devices=interface-name:wlan1;interface-name:p2p0;interface-name:p2p-dev-wlan1
