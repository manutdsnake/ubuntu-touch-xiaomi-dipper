# Keep Wi-Fi associated across suspend. Without a WoWLAN config cfg80211
# disconnects every station on suspend entry (cfg80211_leave_all), so the
# phone dropped off the network each time it slept. 2 = NM_SETTING_WIRELESS_WAKE_ON_WLAN_ANY.
[connection-wowlan]
match-device=type:wifi
wifi.wake-on-wlan=2
