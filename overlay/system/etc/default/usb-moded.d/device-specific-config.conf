# usb-moded passes these through to configfs verbatim, and configfs parses
# idVendor/idProduct with a base prefix - "2717" is read as decimal and lands as
# 0x0a9d, so the 0x is required to get Xiaomi's actual USB vendor id.
IDVENDOR=0x2717
IDPRODUCT_MTP=0xFF40
IDPRODUCT_MTP_ADB=0xFF48
IDPRODUCT_RNDIS=0xFF80
IDPRODUCT_RNDIS_ADB=0xFF88
MANUFACTURER=Xiaomi
PRODUCT=Mi 8
# Disable usb-moded's rescue mode.
USB_MODED_ARGS=
