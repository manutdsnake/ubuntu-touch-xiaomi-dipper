# Android 16's servicemanager on /dev/binder speaks the API 36 dialect:
# AIDL RPC header "aidl3" with the "aidl6" IServiceManager (getService2 etc.).
# With the default ("aidl"/"aidl2") every gbinder call there silently returns
# nothing, so audiosystem-passthrough-af could not register media.audio_flinger
# and the ultrasonic proximity (fed via AudioFlinger setParameters) never ran.
# Only /dev/binder: ofono and the QTI passthrough use /dev/hwbinder, which must
# stay at the default, so do not use a blanket ApiLevel here.
[Protocol]
/dev/binder = aidl3

[ServiceManager]
/dev/binder = aidl6
