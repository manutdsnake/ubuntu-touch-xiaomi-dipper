# ofono-binder-plugin configuration for dipper (the modern plugin, chosen by
# OfonoPlugin: binder in deviceinfo).  It enumerates the HIDL radio slots
# itself - android.hardware.radio@1.x::IRadio/slot1 and /slot2 - and only needs
# the D-Bus object path each modem should get; without it it logs
# "Missing path for slot slot1" and creates nothing.
[Settings]

[slot1]
path=/ril_0


# slot2 needs persist.radio.multisim.config=dsds (set in
# /etc/dipper/vndservicemanager.rc); without it qcril never provisions the
# second subscription and the empty sub echoes every call of slot 1.
[slot2]
path=/ril_1
