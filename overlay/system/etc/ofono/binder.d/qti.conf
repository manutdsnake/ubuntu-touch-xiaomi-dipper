# Load the QTI extension (ofono-binder-plugin-ext-qti, already in the rootfs).
# It registers with vendor.qti.hardware.radio.ims IImsRadio, so SMS delivered
# over IMS reaches ofono and IMS registration/VoLTE is driven by ofono.
# Without it nothing is the IMS client: the network retries MT SMS over CS
# later, and SMS arrive minutes late.
[Settings]
extPlugin = qti
