# ofono RIL configuration for dipper.
#
# The rootfs ships the Jolla sample, which points ofono at /dev/socket/rild -
# the legacy socket RIL that Android 16's qcrild no longer provides.  ofono then
# creates no modem at all and the phone says "No network" with a SIM inserted.
#
# The radio HAL this ROM exposes is HIDL:
#     android.hardware.radio@1.0::IRadio/slot1
#     android.hardware.radio@1.0::IRadio/slot2
# so use ofono's binder transport and name the slots as the HAL does, exactly
# as the working Mi 8 (dipper) port configures it.
[Settings]
SetRadioCapability=off
emptyPinQuery=false
radioPowerCycle=false
confirmRadioPowerOn=false

[ril_0]
transport=binder:name=slot1
name=slot1


# ofono itself uses the binder plugin (binder.conf); this file is still read by
# audiosystem-passthrough (qti) to find the IQcRilAudio/slotN instances it
# registers its callback with.  Without [ril_1] SIM 2 calls had no audio.
[ril_1]
transport=binder:name=slot2
name=slot2
