# The journal is Storage=persistent on this port so that a failed boot can be
# read back from the next working one.  Without a cap it grew to its 10%-of-disk
# default - 496 MB of 500 MB, 3.8 MB free - and then the thing it exists for
# stopped working: the failed security=apparmor boot recorded 126 entries and
# went quiet, which looked exactly like the system freezing three seconds in.
# It was not; there was simply nowhere left to write.
#
# Cap it well below that, so a failed boot always has room.
[Journal]
SystemMaxUse=100M
SystemKeepFree=200M
