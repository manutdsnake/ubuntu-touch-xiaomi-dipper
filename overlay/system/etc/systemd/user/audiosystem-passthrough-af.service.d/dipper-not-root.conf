# The USB console autologins root and SSH logs in as root; each starts a
# systemd --user for root, which started a second passthrough instance with no
# PulseAudio behind it.  Two IQcRilAudio / media.audio_flinger registrations
# compete and the root one wins, so the modem's call-audio parameters and the
# sensor HAL's ultrasound parameters went nowhere.  Only the phablet session.
[Unit]
ConditionUser=!root
