# obexd (Bluetooth file transfer) exited with status 1 during an audio
# restart and stayed down for the rest of the session.
#
# Restart it, but only a few times: when bluetoothd keeps a dead obexd's
# profile registrations ("UUID already registered", obex_server_init failed)
# every new obexd fails the same way, and an unlimited restart woke the phone
# every ~80 s all night (seen on the Mi 9, night of 24-25 Sep: ~900 restarts).
# Restarting bluetoothd (systemctl restart bluetooth) clears that state.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=3

[Service]
Restart=on-failure
RestartSec=10
