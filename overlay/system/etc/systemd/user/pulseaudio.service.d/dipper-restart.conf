# PulseAudio died once with SIGBUS inside the droid module and every restart
# in the next seconds died the same way; systemd hit its start limit after
# six tries in six seconds and left the phone without sound until reboot.
# Keep retrying, with a pause that lets the Android side settle.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=3
