# Cable detection for the Mi 8.  usb-moded's defaults watch
# power_supply/usb, which stays online=0 on this kernel even on a PC (the
# pmi8998 reports a host connection on power_supply/pc_port: TYPE=USB,
# ONLINE=1), and the first extcon (smb2, USB=0); it therefore decided
# "dedicated_charger" and never enabled MTP/ADB.  The PD PHY's extcon4 is the
# one that reports USB=1.  With both it evaluates pc_connected and sets up
# mtp_adb.
[udev]
path = /sys/class/power_supply/pc_port
extcon_path = /sys/class/extcon/extcon4
