# See /usr/libexec/waydroid-vendor-view.  It has to run before "waydroid
# upgrade -o", which writes the container's lxc config (config_nodes) and picks
# /run/waydroid-vendor only if it already exists - so clear the unit's
# ExecStartPre and list both again in that order.
[Service]
ExecStartPre=
ExecStartPre=/usr/libexec/waydroid-vendor-view
ExecStartPre=-/usr/bin/waydroid upgrade -o
